<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Amo Invitar</title>
  <link rel="icon" type="image/svg+xml" href="https://amoinvitar.com/favicon.svg">
  <link rel="stylesheet" href="/comun/fonts/google/great-vibes+jost.css">
  <link rel="stylesheet" href="/comun/css/cuenta.css">
</head>
<body>
  <header class="barra">
    <a href="https://amoinvitar.com/"><img src="/comun/img/amoinvitar-fondo-claro.svg" alt="Amo Invitar!" width="120"></a>
    <nav><a href="/tienda/">Tienda</a></nav>
  </header>
  <main class="angosto">
    <h1>Entrar</h1>
    <p class="sub">Para ver y editar las invitaciones compradas. Sin contraseña.</p>
    <div class="tarjeta">
      <a class="btn btn-google btn-bloque" id="google" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuar con Google
      </a>
      <div class="separador">o con el mail</div>
      <form id="form">
        <div class="campo">
          <label for="email">Mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="nombre@mail.com">
          <p class="ayuda">Llega un link para entrar. El mismo mail de la compra.</p>
        </div>
        <button class="btn btn-bloque" type="submit" id="enviar">Mandarme el link</button>
      </form>
      <div id="mensaje" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var siguiente = q.get('siguiente') || '/mi-cuenta';
      var g = document.getElementById('google');
      g.href = '/auth/google?siguiente=' + encodeURIComponent(siguiente);
      var msj = document.getElementById('mensaje');
      function mostrar(t, clase) { msj.className = 'mensaje ' + clase; msj.textContent = t; }
      var errores = { vencido: 'El link venció o ya se usó. Pedir uno nuevo acá abajo.', google: 'No se pudo entrar con Google. Probar con el mail.' };
      if (errores[q.get('error')]) mostrar(errores[q.get('error')], 'error');
      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var boton = document.getElementById('enviar');
        boton.disabled = true; boton.textContent = 'Enviando…';
        fetch('/auth/enlace', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, siguiente: siguiente }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            boton.disabled = false; boton.textContent = 'Mandarme el link';
            if (!x.ok) return mostrar(x.j.error || 'No se pudo enviar.', 'error');
            mostrar('¡Listo! Revisar el correo (y la carpeta de spam). El link vale 15 minutos.', 'ok');
            if (x.j.prueba) { var a = document.createElement('a'); a.href = x.j.prueba; a.textContent = ' Entrar (modo prueba)'; a.id = 'link-prueba'; msj.appendChild(a); }
          })
          .catch(function () { boton.disabled = false; boton.textContent = 'Mandarme el link'; mostrar('Sin conexión. Probar de nuevo.', 'error'); });
      });
    })();
  </script>
</body>
</html>
