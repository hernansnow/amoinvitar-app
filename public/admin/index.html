<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración · Amo Invitar!</title>
<link rel="icon" type="image/svg+xml" href="https://amoinvitar.com/favicon.svg">
<link rel="stylesheet" href="/comun/fonts/google/jost.css">
<style>
  :root { --verde: #4e9c87; --verde-2: #3f8a77; --claro: #e5f3ec; --tinta: #1e2a26; --suave: #66736e; --linea: #d8e8e1; --rojo: #b3392c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Jost, system-ui, sans-serif; color: var(--tinta); background: #f6f9f8; }
  header { background: #fff; border-bottom: 1px solid var(--linea); padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; margin: 0; font-weight: 500; }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 15px; }
  a { color: var(--verde-2); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .tabs button { font: 500 15px/1 Jost, sans-serif; background: #fff; border: 1px solid var(--linea); border-radius: 999px; padding: 11px 18px; cursor: pointer; color: var(--tinta); }
  .tabs button[aria-selected="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .tabs b { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #ffb3a7; color: #5a1a10; font-size: 12px; margin-left: 6px; }
  .tabs button[aria-selected="true"] b { background: #fff; color: var(--verde-2); }
  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .tarjeta h3 { margin: 0 0 2px; font-size: 18px; }
  .meta { color: var(--suave); font-size: 14.5px; }
  .desc { white-space: pre-wrap; background: #f6f9f8; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button.b, a.b { font: 600 14px/1 Jost, sans-serif; border-radius: 999px; padding: 10px 16px; border: 1px solid var(--verde); background: var(--verde); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.b.sec, a.b.sec { background: #fff; color: var(--verde-2); }
  button.b.mal { background: #fff; border-color: var(--rojo); color: var(--rojo); }
  button.b:disabled { opacity: .5; cursor: wait; }
  select, input, textarea { font: 15px Jost, sans-serif; padding: 9px 11px; border: 1px solid #c9dcd4; border-radius: 10px; background: #fff; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; font-size: 15px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eef4f1; text-align: left; vertical-align: top; }
  th { background: #f3f9f6; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .envuelve { overflow-x: auto; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-radius: 99px; padding: 3px 9px; background: var(--claro); color: var(--verde-2); }
  .tag.aviso { background: #fff1d6; color: #8a5a00; } .tag.mal { background: #fde3df; color: var(--rojo); }
  .vacio { color: var(--suave); padding: 24px; text-align: center; background: #fff; border: 1px dashed var(--linea); border-radius: 14px; }
  #aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 30; max-width: 90vw; }
  #aviso.error { background: var(--rojo); }
  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 460px; width: calc(100vw - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(30, 42, 38, .5); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
  dialog form { display: grid; gap: 12px; }
  #entrada { max-width: 420px; margin: 60px auto; text-align: center; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .cifras .c { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; text-align: left; font: inherit; cursor: default; }
  .cifras button.c { cursor: pointer; } .cifras button.c:hover { border-color: var(--verde); }
  .cifras b { display: block; font: 500 28px/1.15 Jost, sans-serif; } .cifras span { color: var(--suave); font-size: 14px; }
  .barras { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; height: 170px; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 14px 14px 8px; margin-bottom: 18px; }
  .barras div { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%; text-align: center; font-size: 12px; color: var(--suave); }
  .barras i { display: block; flex: none; background: var(--verde); border-radius: 6px 6px 0 0; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filtros label { min-width: 150px; } .filtros .ancho { flex: 1; min-width: 220px; }
  .dos { display: grid; gap: 14px; } @media (min-width: 800px) { .dos { grid-template-columns: 1fr 1fr; } }
  .caja { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; background: var(--claro); font-size: 15px; } .caja.aviso { background: #fff1d6; } .caja.mal { background: #fde3df; }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; } .acciones .b { padding: 7px 12px; font-size: 13px; }
  .grupo { border-top: 1px solid #eef4f1; padding-top: 12px; margin-top: 12px; display: grid; gap: 8px; } .grupo h3 { font-size: 15px; margin: 0; }
  .marcas { display: flex; flex-wrap: wrap; gap: 6px 14px; } .marcas label { display: flex; flex-direction: row; gap: 6px; align-items: center; color: var(--tinta); } .marcas input { width: auto; }
  dialog.ancho { max-width: 640px; }
  .chico { font-size: 13px; color: var(--suave); }
  .precios-base .fila { flex-wrap: nowrap; } .precios-base .fila > span:first-child { flex: 1; }
  .precios-base { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 24px; } /* README (ronda 47) */
</style>
</head>
<body>
<header>
  <h1>Administración · Amo Invitar!</h1>
  <nav><a href="/mi-cuenta">Mi cuenta</a><a href="/">Sitio</a></nav>
</header>
<main>
  <div id="entrada" hidden>
    <h2>Acceso de administración</h2>
    <p class="meta">Entra con una cuenta de administrador, o escribe la clave de administración.</p>
    <p><a class="b" href="/entrar?siguiente=/admin/">Entrar con mi cuenta</a></p>
    <form id="f-clave" class="fila" style="justify-content:center"><input type="password" id="clave" placeholder="Clave de administración" autocomplete="off"><button class="b sec" type="submit">Usar clave</button></form>
  </div>
  <div id="consola" hidden>
    <div class="tabs" role="tablist" id="tabs"></div>
    <section id="vista"></section>
  </div>
</main>
<div id="aviso" hidden></div>
<dialog id="dlg" class="ancho"><h2 id="dlg-t"></h2><form method="dialog" id="dlg-f"><div id="dlg-c" style="display:grid;gap:12px"></div><div class="fila" style="justify-content:flex-end"><button class="b sec" type="button" id="dlg-no">Cancelar</button><button class="b" type="submit" id="dlg-si">Aceptar</button></div></form></dialog>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var D = null, TAB = 'resumen', ANIO = new Date().getFullYear();
  var clave = ''; try { clave = sessionStorage.getItem('ai_admin') || ''; } catch (e) { /* sin almacenamiento */ }
  function el(t, a, h) { var e = document.createElement(t); Object.keys(a || {}).forEach(function (k) { if (k === 'class') e.className = a[k]; else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), a[k]); else if (a[k] != null && a[k] !== false) e.setAttribute(k, a[k] === true ? '' : a[k]); }); [].concat(h == null ? [] : h).forEach(function (x) { if (x != null) e.append(x); }); return e; }
  function aviso(t, mal) { var a = $('#aviso'); a.textContent = t; a.className = mal ? 'error' : ''; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.hidden = true; }, 4200); }
  function api(ruta, cuerpo) {
    var o = { headers: Object.assign({ 'content-type': 'application/json' }, clave ? { 'x-admin': clave } : {}) };
    if (cuerpo !== undefined) { o.method = 'POST'; o.body = JSON.stringify(cuerpo); }
    return fetch(ruta, o).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Error'); e.status = r.status; throw e; } return j; }); });
  }
  var fecha = function (iso) { return iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '—'; };
  var fechaSeg = function (s) { return s ? new Date(s * 1000).toISOString().slice(0, 10).split('-').reverse().join('/') : '—'; };
  var hoy = function () { return new Date().toISOString(); };
  var eur = function (n) { return Number(n || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; };
  var dinero = function (n, m) { try { return new Intl.NumberFormat('es-ES', { style: 'currency', currency: m || 'EUR' }).format(n); } catch (e) { return n + ' ' + m; } };
  var q = function (o) { return Object.keys(o).filter(function (k) { return o[k] !== '' && o[k] != null; }).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&'); };
  var MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  var MEDIOS = { stripe: 'Tarjeta (Stripe)', paypal: 'PayPal', mercadopago: 'Mercado Pago', transferencia: 'Transferencia', gratis: 'Gratis', cupon: 'Cupón 100 %', admin: 'Administración', profesionales: 'Profesionales' };

  // Ventanita para pedir datos
  function pedir(titulo, campos, ok) {
    return new Promise(function (res) {
      var d = $('#dlg'), c = $('#dlg-c'); $('#dlg-t').textContent = titulo; $('#dlg-si').textContent = ok || 'Aceptar'; c.replaceChildren();
      var ins = campos.map(function (f) {
        if (f.nota) { c.append(el('p', { class: 'meta', style: 'margin:0' }, f.nota)); return null; }
        var i = f.tipo === 'select' ? el('select', { name: f.n }, f.op.map(function (o) { return el('option', { value: o[0] }, o[1]); })) : f.tipo === 'texto' ? el('textarea', { name: f.n, rows: 3 }) : el('input', { name: f.n, type: f.tipo || 'text' });
        if (f.v != null) i.value = f.v; c.append(el('label', {}, [f.l, i])); return i;
      }).filter(Boolean);
      var fin = function (v) { d.close(); res(v); };
      $('#dlg-no').onclick = function () { fin(null); };
      $('#dlg-f').onsubmit = function (e) { e.preventDefault(); var r = {}; ins.forEach(function (i) { r[i.name] = i.value; }); fin(r); };
      d.showModal();
    });
  }
  // Ventana con contenido propio (ficha de invitación, de cliente…)
  function ventana(titulo, cuerpo) {
    var d = $('#dlg'), c = $('#dlg-c'); $('#dlg-t').textContent = titulo; c.replaceChildren(cuerpo);
    $('#dlg-si').hidden = true; $('#dlg-no').textContent = 'Cerrar'; $('#dlg-no').onclick = function () { d.close(); $('#dlg-si').hidden = false; $('#dlg-no').textContent = 'Cancelar'; };
    $('#dlg-f').onsubmit = function (e) { e.preventDefault(); };
    d.onclose = function () { $('#dlg-si').hidden = false; $('#dlg-no').textContent = 'Cancelar'; };
    d.showModal();
  }
  function accion(btn, ruta, cuerpo, msg, despues) {
    if (btn) btn.disabled = true;
    return api(ruta, cuerpo || {}).then(function (r) { aviso(msg || 'Listo ✓'); return (despues ? despues(r) : refrescar()).then(function () { return r; }); }).catch(function (e) { aviso(e.message, true); }).then(function (r) { if (btn) btn.disabled = false; return r; });
  }
  function tabla(cab, filas) {
    return el('div', { class: 'envuelve' }, el('table', {}, [el('thead', {}, el('tr', {}, cab.map(function (c) { return el('th', {}, c); }))), el('tbody', {}, filas.map(function (f) { return el('tr', {}, f.map(function (c) { return el('td', {}, c); })); }))]));
  }
  function tag(t, clase) { return el('span', { class: 'tag' + (clase ? ' ' + clase : '') }, t); }
  var vacio = function (t) { return el('p', { class: 'vacio' }, t); };
  var btn = function (txt, clase, fn) { var b = el('button', { class: 'b ' + (clase || ''), type: 'button' }, txt); b.onclick = function () { fn(b); }; return b; };
  function buscador(valores, campos, alBuscar) {
    var f = el('form', { class: 'filtros' }), ins = {};
    campos.forEach(function (c) {
      var i = c.op ? el('select', { name: c.n }, c.op.map(function (o) { return el('option', { value: o[0] }, o[1]); })) : el('input', { name: c.n, type: 'search', placeholder: c.ph || '' });
      i.value = valores[c.n] || ''; ins[c.n] = i; f.append(el('label', { class: c.ancho ? 'ancho' : '' }, [c.l, i]));
    });
    f.append(el('button', { class: 'b', type: 'submit' }, 'Buscar'));
    f.onsubmit = function (e) { e.preventDefault(); var r = {}; Object.keys(ins).forEach(function (k) { r[k] = ins[k].value; }); alBuscar(r); };
    return f;
  }
  function paginas(pag, hayMas, ir) {
    return el('div', { class: 'fila' }, [pag > 0 ? btn('← Anteriores', 'sec', function () { ir(pag - 1); }) : null, hayMas ? btn('Siguientes →', 'sec', function () { ir(pag + 1); }) : null, el('span', { class: 'chico' }, 'Página ' + (pag + 1))]);
  }
  var VISTAS = {}; // datos de cada pestaña (se cargan al abrirla)

  // ══ Resumen ══
  function vistaResumen() {
    var v = el('div'), s = VISTAS.resumen;
    if (!s) { cargaVista('resumen', '/api/admin/estadisticas?year=' + ANIO); return vacio('Cargando…'); }
    var anios = el('select', { style: 'width:auto', onchange: function (e) { ANIO = +e.target.value; VISTAS.resumen = null; pinta(); } }, [0, 1, 2, 3].map(function (i) { var y = new Date().getFullYear() - i; return el('option', { value: y }, String(y)); })); anios.value = ANIO;
    v.append(el('div', { class: 'fila', style: 'justify-content:space-between;margin:0 0 12px' }, [el('h2', { style: 'margin:0' }, 'Resumen del año'), anios]));
    var ir = function (tab) { return function () { TAB = tab; pinta(); }; };
    var p = s.pendientes;
    v.append(el('div', { class: 'cifras' }, [
      el('div', { class: 'c' }, [el('b', {}, eur(s.total)), el('span', {}, 'Ventas con IVA (' + s.operaciones + ' cobros)')]),
      el('div', { class: 'c' }, [el('b', {}, eur(s.neto)), el('span', {}, 'Sin IVA')]),
      el('div', { class: 'c' }, [el('b', {}, eur(s.iva)), el('span', {}, 'IVA incluido')]),
      el('div', { class: 'c' }, [el('b', {}, String(s.usuarios)), el('span', {}, 'Clientes')])]));
    v.append(el('h3', { style: 'margin:6px 0 8px' }, 'Pendiente de revisar'));
    v.append(el('div', { class: 'cifras' }, [['transferencias', 'Transferencias por cobrar', 'pedidos'], ['medidas', 'Diseños a medida por aprobar', 'medidas'], ['solicitudes', 'Solicitudes de cuenta profesional', 'pro'], ['compras', 'Pedidos de créditos por cobrar', 'pro'], ['consultas', 'Consultas nuevas', 'consultas']].map(function (x) {
      return el('button', { class: 'c', type: 'button', onclick: x[0] === 'transferencias' ? function () { FILTROS.pedidos = { estado: 'pendiente', medio: 'transferencia' }; VISTAS.pedidos = null; TAB = 'pedidos'; pinta(); } : ir(x[2]) }, [el('b', { style: p[x[0]] ? 'color:#b3392c' : '' }, String(p[x[0]])), el('span', {}, x[1])]);
    }).concat([el('div', { class: 'c' }, [el('b', {}, String(s.eventos.vencen30)), el('span', {}, 'Invitaciones que vencen en 30 días')])])));
    var max = Math.max.apply(null, s.porMes.concat([1]));
    v.append(el('h3', { style: 'margin:6px 0 8px' }, 'Ventas por mes (' + s.anio + ')'));
    v.append(el('div', { class: 'barras' }, s.porMes.map(function (n, i) { return el('div', { title: eur(n) }, [el('span', {}, n ? String(Math.round(n)) : ''), el('i', { style: 'height:' + Math.max(2, Math.round(n / max * 100)) + 'px' }), el('span', {}, MESES[i])]); })));
    v.append(el('div', { class: 'dos' }, [
      el('div', {}, [el('h3', {}, 'Por medio de pago'), tabla(['Medio', 'Ventas'], s.porMedio.length ? s.porMedio.map(function (x) { return [MEDIOS[x.k] || x.k, eur(x.v)]; }) : [['—', '—']])]),
      el('div', {}, [el('h3', {}, 'Por país'), tabla(['País', 'Ventas'], s.porPais.length ? s.porPais.map(function (x) { return [x.k, eur(x.v)]; }) : [['—', '—']])])]));
    var pq = s.eventos.porPaquete;
    v.append(el('div', { class: 'dos', style: 'margin-top:14px' }, [
      el('div', {}, [el('h3', {}, 'Invitaciones publicadas por plan'), tabla(['Plan', 'Cantidad'], ['gratis', 'basic', 'premium', 'deluxe'].map(function (k) { return [k, String(pq[k] || 0)]; }))]),
      el('div', {}, [el('h3', {}, 'Pedidos'), tabla(['Estado', 'Cantidad'], Object.keys(s.pedidos).length ? Object.keys(s.pedidos).map(function (k) { return [k, String(s.pedidos[k])]; }) : [['—', '0']])])]));
    v.append(el('p', { class: 'chico' }, s.nota));
    return v;
  }

  // ══ Pedidos ══
  var FILTROS = { pedidos: {}, eventos: {}, usuarios: {} }, PAG = { pedidos: 0, eventos: 0, usuarios: 0 };
  function vistaPedidos() {
    var v = el('div'), f = FILTROS.pedidos;
    v.append(el('h2', {}, 'Pedidos'));
    v.append(buscador(f, [{ n: 'q', l: 'Buscar', ph: 'mail, n.º de pedido, cupón o evento', ancho: true }, { n: 'estado', l: 'Estado', op: [['', 'Todos'], ['pendiente', 'Pendientes'], ['pagado', 'Pagados'], ['cancelado', 'Cancelados'], ['reembolsado', 'Reembolsados']] },
      { n: 'medio', l: 'Medio', op: [['', 'Todos'], ['stripe', 'Tarjeta'], ['paypal', 'PayPal'], ['mercadopago', 'Mercado Pago'], ['transferencia', 'Transferencia'], ['gratis', 'Gratis'], ['cupon', 'Cupón'], ['admin', 'Administración']] }],
      function (r) { FILTROS.pedidos = r; PAG.pedidos = 0; VISTAS.pedidos = null; pinta(); }));
    var d = VISTAS.pedidos;
    if (!d) { cargaVista('pedidos', '/api/admin/pedidos?' + q(Object.assign({ pagina: PAG.pedidos }, f))); return append(v, vacio('Cargando…')); }
    if (!d.pedidos.length) return append(v, vacio('No hay pedidos con esos filtros.'));
    v.append(tabla(['Pedido', 'Cliente', 'Importe', 'Medio', 'Estado', ''], d.pedidos.map(function (p) {
      var a = [];
      if (p.estado === 'pendiente' && p.medio === 'transferencia') a.push(btn('Marcar cobrada', '', function (b) { if (confirm('¿Ya llegó la transferencia #' + p.numero + '? Se activa el pedido y se emite la factura.')) accion(b, '/api/admin/pedidos/' + p.id + '/cobrado', {}, 'Cobrada: pedido activado'); }));
      if (p.estado === 'pendiente') a.push(btn('Cancelar', 'mal', function (b) { if (confirm('¿Cancelar el pedido #' + p.numero + '?')) accion(b, '/api/admin/pedidos/' + p.id + '/cancelar', {}, 'Pedido cancelado'); }));
      if (p.estado === 'pagado') {
        if (p.urlFactura) a.push(el('a', { class: 'b sec', href: p.urlFactura, target: '_blank', rel: 'noopener' }, 'Factura'));
        else if (p.importe > 0) a.push(btn('Emitir factura', 'sec', function (b) { accion(b, '/api/admin/pedidos/' + p.id + '/facturar', {}, 'Factura emitida'); }));
        a.push(btn('Reenviar mail', 'sec', function (b) { accion(b, '/api/admin/pedidos/' + p.id + '/reenviar', {}, 'Mail reenviado', function () { return Promise.resolve(); }); }));
        a.push(btn('Reembolsado', 'mal', function (b) { pedir('Registrar reembolso #' + p.numero, [{ nota: 'Esto solo lo anota. El dinero se devuelve desde Stripe, PayPal, Mercado Pago o tu banco.' }, { n: 'nota', l: 'Nota (opcional)' }], 'Registrar').then(function (r) { if (r) accion(b, '/api/admin/pedidos/' + p.id + '/reembolsado', r, 'Registrado como reembolsado'); }); }));
      }
      if (p.evento_id) a.push(el('a', { class: 'b sec', href: '/panel/' + p.evento_id, target: '_blank', rel: 'noopener' }, 'Panel'));
      var cls = p.estado === 'pagado' ? '' : p.estado === 'pendiente' ? 'aviso' : 'mal';
      return [el('div', {}, [el('strong', {}, '#' + p.numero), el('div', { class: 'meta' }, p.producto || ''), el('div', { class: 'chico' }, fechaSeg(p.creado) + (p.cupon ? ' · cupón ' + p.cupon : '') + (p.pais ? ' · ' + p.pais : ''))]), p.email,
        p.importe ? dinero(p.importe, p.moneda) : 'Gratis', MEDIOS[p.medio] || p.medio, tag(p.estado, cls), el('div', { class: 'acciones' }, a)];
    })));
    v.append(paginas(d.pagina, d.hayMas, function (n) { PAG.pedidos = n; VISTAS.pedidos = null; pinta(); }));
    return v;
  }
  function append(v, x) { v.append(x); return v; }

  // ══ Facturas ══

    return api('/api/admin/resumen').then(function (d) {
      return api('/api/admin/estadisticas?year=' + ANIO).then(function (s) { D = d; D.pendientes = s.pendientes; VISTAS.resumen = s; $('#entrada').hidden = true; $('#consola').hidden = false; pinta(); });
    }).catch(function (e) { if (e.status === 403) { $('#consola').hidden = true; $('#entrada').hidden = false; } else aviso(e.message, true); });
  }
  $('#f-clave').addEventListener('submit', function (e) { e.preventDefault(); clave = $('#clave').value.trim(); try { sessionStorage.setItem('ai_admin', clave); } catch (x) { /* sin almacenamiento */ } cargar(); });
  cargar();
})();

</script>
