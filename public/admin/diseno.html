<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Diseño propio · Consola</title>
<link rel="stylesheet" href="/comun/fonts/google/jost.css">
<!-- README (ronda 57): diseño propio de una invitación (colores, tipografía, imágenes, HTML; a medida y corporativo) -->
<style>
  :root { --verde: #4e9c87; --verde-2: #3f8a77; --claro: #e5f3ec; --tinta: #1e2a26; --suave: #66736e; --linea: #d8e8e1; --rojo: #b3392c; --aviso: #b7791f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Jost, system-ui, sans-serif; color: var(--tinta); background: #f6f9f8; }
  header { background: #fff; border-bottom: 1px solid var(--linea); padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 19px; margin: 0; font-weight: 500; }
  header .meta { margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; display: grid; gap: 16px; }
  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 18px; }
  .tarjeta h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  .meta { color: var(--suave); font-size: 13.5px; margin: 4px 0; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .b { font: 500 14px/1 Jost, sans-serif; border: 1px solid var(--verde); background: var(--verde); color: #fff; border-radius: 999px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .b.sec { background: #fff; color: var(--verde-2); }
  .b.mal { background: #fff; color: var(--rojo); border-color: var(--rojo); }
  .b:disabled { opacity: .5; cursor: default; }
  label.campo { display: grid; gap: 4px; font-size: 13.5px; color: var(--suave); }
  select, input[type=text], textarea { font: 14px/1.4 Jost, system-ui, sans-serif; border: 1px solid var(--linea); border-radius: 10px; padding: 9px 11px; background: #fff; color: var(--tinta); width: 100%; }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 150px; resize: vertical; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .dos { grid-template-columns: 1fr; } }
  .tag { display: inline-block; font-size: 12px; border-radius: 999px; padding: 3px 10px; background: var(--claro); color: var(--verde-2); }
  .tag.aviso { background: #fdf3e2; color: var(--aviso); }
  .tag.mal { background: #fbe9e7; color: var(--rojo); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  th { color: var(--suave); font-weight: 500; }
  td.acc { white-space: nowrap; text-align: right; }
  td.acc button, td.acc a { font: 13px Jost, sans-serif; background: none; border: 0; color: var(--verde-2); cursor: pointer; padding: 2px 6px; }
  td.acc button.quitar { color: var(--rojo); }
  .muestras { display: flex; gap: 6px; flex-wrap: wrap; }
  .muestra { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); position: relative; cursor: pointer; }
  .muestra span { position: absolute; top: 36px; left: 0; font-size: 10.5px; color: var(--suave); white-space: nowrap; }
  .soltar { border: 2px dashed var(--linea); border-radius: 12px; padding: 22px; text-align: center; color: var(--suave); }
  .soltar.encima { border-color: var(--verde); background: var(--claro); }
  .registro { font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: #f6f9f8; border-radius: 10px; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
  .aviso-caja { background: #fdf3e2; border-radius: 10px; padding: 10px 12px; color: #6b4b12; font-size: 13.5px; }
  .ok-caja { background: var(--claro); border-radius: 10px; padding: 10px 12px; color: var(--verde-2); font-size: 13.5px; }
  details summary { cursor: pointer; color: var(--verde-2); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; display: none; z-index: 9; }
  .vacio { color: var(--suave); font-size: 13.5px; }
  /* README (ronda 59): reemplazo de colores y tipografías */
  .reemplazos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 6px 18px; }
  .reemp { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eef3f1; font-size: 13.5px; }
  .reemp .sw { width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(0,0,0,.15); flex: none; }
  .reemp code { font-size: 12.5px; min-width: 66px; }
  .reemp .cant { color: var(--suave); font-size: 12px; min-width: 34px; }
  .reemp input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--linea); border-radius: 7px; background: #fff; flex: none; }
  .reemp input[type=text] { width: 92px; padding: 6px 8px; font-size: 13px; }
  .reemp.activo { background: var(--claro); border-radius: 8px; padding-left: 6px; }
  .reemp .fl { font-size: 18px; color: var(--suave); }
  /* README (ronda 61): cada uso de un color por separado */
  .reemp .cant { border: 0; background: none; cursor: pointer; text-align: left; padding: 2px 0; font: inherit; font-size: 12px; color: var(--suave); }
  .reemp .cant:hover { color: inherit; text-decoration: underline; }
  .reemp-grupo.abierto { grid-column: 1 / -1; }
  .usos { margin: 4px 0 10px 36px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 2px 18px; }
  .uso { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 4px; border-radius: 6px; }
  .uso.activo { background: var(--claro); }
  .uso .donde { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uso .donde b { font-weight: 600; }
  .uso input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--linea); border-radius: 6px; background: #fff; flex: none; }
  .uso input[type=text] { width: 84px; padding: 4px 6px; font-size: 12.5px; }
  /* README (ronda 62): en el celular nada se sale del marco */
  .reemp, .uso { min-width: 0; }
  .reemp-grupo { min-width: 0; }
  @media (max-width: 600px) {
    .reemp { flex-wrap: wrap; gap: 6px; }
    .reemp input[type=text] { width: 80px; }
    .reemp code { min-width: 0; font-size: 12px; }
    .reemp .cant { min-width: 0; }
    .reemp .fl { display: none; }
    .usos { margin-left: 0; }
    .uso { flex-wrap: wrap; }
    .uso .donde { flex-basis: 100%; white-space: normal; overflow-wrap: anywhere; }
    .fuente-fila { grid-template-columns: 1fr 22px 1fr; }
    .fuente-fila > :nth-child(4) { grid-column: 1 / 2; }
    .fuente-fila > :nth-child(5) { grid-column: 2 / 4; }
  }
  .usos .nota { grid-column: 1 / -1; color: var(--suave); font-size: 12px; padding: 2px 4px; }
  .fuente-fila { display: grid; grid-template-columns: 1fr 26px 1fr 110px 1.3fr; gap: 8px; align-items: center; margin: 6px 0; }
  .fuente-fila .tam { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--suave); }
  .fuente-fila .tam input { width: 64px; }
  @media (max-width: 760px) { .fuente-fila { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><a href="/admin/" class="b sec">← Consola</a><h1 id="titulo">Diseño propio</h1><p class="meta" id="sub"></p></header>
<main id="main"><p class="vacio">Cargando…</p></main>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var $ = function (s, c) { return (c || document).querySelector(s); };
  var id = new URLSearchParams(location.search).get('id') || '';
  var clave = ''; try { clave = sessionStorage.getItem('ai_admin') || ''; } catch (e) { /* sin almacenamiento */ }
  var D = null, ARCH = null, CATALOGO = null, DETECTADO = null;
  function el(tag, at, hijos) {
    var e = document.createElement(tag);
    Object.keys(at || {}).forEach(function (k) { var v = at[k]; if (v == null || v === false) return; if (k === 'text') e.textContent = v; else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v); else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v === true ? '' : v); });
    [].concat(hijos == null ? [] : hijos).forEach(function (h) { if (h != null && h !== false) e.append(h.nodeType ? h : String(h)); });
    return e;
  }
  function toast(t, mal) { var x = $('#toast'); x.textContent = t; x.style.background = mal ? '#b3392c' : '#1e2a26'; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = 'none'; }, 3200); }
  function api(ruta, op) {
    op = op || {};
    var h = Object.assign({}, clave ? { 'x-admin': clave } : {}, op.headers || {});
    if (op.json !== undefined) { h['content-type'] = 'application/json'; op.body = JSON.stringify(op.json); }
    return fetch(ruta, { method: op.method || 'GET', headers: h, body: op.body, credentials: 'same-origin' }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
    });
  }
  var API = '/api/admin/propio/' + encodeURIComponent(id);
  var kb = function (n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; };

  // ── ZIP: armar (sin compresión) y leer (deflate con DecompressionStream) ─────
  var CRC = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function armarZip(archivos) { // [{ruta, datos: Uint8Array}]
    var enc = new TextEncoder(), partes = [], central = [], off = 0;
    archivos.forEach(function (a) {
      var nom = enc.encode(a.ruta), crc = crc32(a.datos), tam = a.datos.length;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, tam, true); lh.setUint32(22, tam, true); lh.setUint16(26, nom.length, true);
      partes.push(new Uint8Array(lh.buffer), nom, a.datos);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, tam, true); ch.setUint32(24, tam, true); ch.setUint16(28, nom.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nom);
      off += 30 + nom.length + tam;
    });
    var tamC = central.reduce(function (t, x) { return t + x.length; }, 0);
    var fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true); fin.setUint32(12, tamC, true); fin.setUint32(16, off, true);
    return new Blob(partes.concat(central, [new Uint8Array(fin.buffer)]), { type: 'application/zip' });
  }
  async function leerZip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
    var e = -1; for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('No parece un .zip');
    var n = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true), out = [];
    for (var k = 0; k < n; k++) {
      var metodo = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true), lnom = dv.getUint16(p + 28, true), lext = dv.getUint16(p + 30, true), lcom = dv.getUint16(p + 32, true), loc = dv.getUint32(p + 42, true);
      var nombre = dec.decode(u8.subarray(p + 46, p + 46 + lnom));
      p += 46 + lnom + lext + lcom;
      if (/\/$/.test(nombre) || /(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)/.test(nombre)) continue;
      var ini = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true), crudo = u8.subarray(ini, ini + comp), datos;
      if (metodo === 0) datos = crudo.slice();
      else if (metodo === 8) datos = new Uint8Array(await new Response(new Blob([crudo]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else throw new Error('Compresión no soportada en ' + nombre);
      out.push({ ruta: nombre, datos: datos });
    }
    return out;
  }
  // Si todo viene adentro de una carpeta (kit-ev_xxx/…), se le quita esa primera carpeta
  function sinCarpetaComun(lista) {
    var primeras = lista.map(function (a) { return a.ruta.split('/')[0]; });
    var unica = primeras.every(function (x, i) { return x === primeras[0] && lista[i].ruta.indexOf('/') > 0; });
    if (unica && primeras.length) lista.forEach(function (a) { a.ruta = a.ruta.slice(primeras[0].length + 1); });
    return lista;
  }
  function descargar(blob, nombre) { var a = el('a', { href: URL.createObjectURL(blob), download: nombre }); document.body.append(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
  async function hash(u8) { var h = await crypto.subtle.digest('SHA-256', u8); return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }

  var LEEME = [
    'DISEÑO PROPIO · Amo Invitar! (kit de la invitación)',
    '',
    'Esta carpeta es el diseño ACTUAL de la invitación: el modelo base más lo que ya se subió.',
    'Editá lo que quieras y volvé a subir (el .zip entero o solo lo que cambiaste) desde la consola → Diseño propio.',
    '',
    'CÓMO FUNCIONA',
    '- Lo que subís con la MISMA ruta reemplaza al archivo del modelo (img/separador.png, estilo.css, index.html…).',
    '- Lo que no subís sigue saliendo del modelo base. Lo nuevo (img/mi-fondo.jpg) se suma y lo podés usar en HTML y CSS.',
    '- Al subir, la consola saltea los archivos que no cambiaron (si dejás marcada esa opción).',
    '',
    'ARCHIVOS',
    '- index*.html: plantillas. index.html = Deluxe de boda; index-premium.html / index-basic.html = esos planes;',
    '  index-15.html, index-cumple.html, index-bautismo.html… = otros eventos (y -premium / -basic).',
    '  Se usa la que corresponde al evento y al plan de la invitación; en la consola podés fijar una para todo.',
    '- estilo.css, tema.css: estilos del modelo. tema.css trae las variables (--color-principal, --fuente-titulos…).',
    '- img/: imágenes del diseño (fondos, separadores, íconos, PNG…).',
    '- modelo.json: datos del modelo (secciones por plan, paleta, fotos de muestra). Solo tocarlo si sabés lo que hace.',
    '- Las fuentes y scripts comunes se cargan con ../../comun/… : esas rutas se dejan como están.',
    '',
    'MARCAS QUE NO HAY QUE BORRAR (llenan los datos que el cliente carga en su panel)',
    '- data-t="clave": texto traducible (títulos, botones).   - data-campo / data-campo-html="ruta": dato del panel.',
    '- data-si="ruta": se muestra solo si el dato existe.     - data-repetir="lista": se repite por cada elemento.',
    '- data-seccion="id": la sección que el cliente prende o apaga.  - data-componente="…": bloques armados por la app.',
    '- data-i="campo": campo dentro de un elemento repetido.',
    'Podés mover, envolver y cambiar clases y estilos libremente: lo importante es que la marca siga en el elemento.',
    '',
    'FUENTES: subí los archivos (.woff2) en fonts/ y declaralos con @font-face en estilo.css, o usá Google Fonts',
    'desde la consola (campo «HTML extra en el <head>»).',
  ].join('\r\n');

  async function descargarKit(b) {
    var p = D.propio, base = $('#base').value || (p && p.base) || D.evento.modelo;
    if (!base) return toast('Elegí primero el modelo base', true);
    b.disabled = true; var txt = b.textContent;
    try {
      if (!ARCH) ARCH = await fetch('/modelos/archivos.json').then(function (r) { return r.json(); });
      var lista = (ARCH[base] || []).map(function (x) { return x[0]; });
      var subidos = (D.archivos || []).map(function (a) { return a.ruta; });
      subidos.forEach(function (r) { if (lista.indexOf(r) < 0) lista.push(r); });
      // Lo actual: con diseño propio guardado, la ruta propia (subido o modelo); si no, el modelo base
      var raiz = p && p.base === base && D.ruta ? D.ruta : '/modelos/' + base;
      var archivos = [], i = 0;
      for (var k = 0; k < lista.length; k++) {
        b.textContent = 'Armando… ' + (++i) + '/' + lista.length;
        var r = await fetch(raiz + '/' + lista[k].split('/').map(encodeURIComponent).join('/'));
        if (r.ok) archivos.push({ ruta: lista[k], datos: new Uint8Array(await r.arrayBuffer()) });
      }
      archivos.push({ ruta: 'LEEME.txt', datos: new TextEncoder().encode(LEEME) });
      descargar(armarZip(archivos.map(function (a) { return { ruta: 'kit-' + id + '/' + a.ruta, datos: a.datos }; })), 'kit-' + id + '-' + base + '.zip');
      toast('Kit descargado: ' + archivos.length + ' archivos');
    } catch (e) { toast(e.message, true); }
    b.disabled = false; b.textContent = txt;
  }

  // README (ronda 63): un archivo que se llama igual que uno del modelo va a la misma carpeta que ese
  // (subir la carpeta img entera o imágenes sueltas sin carpeta las dejaba en la raíz y no reemplazaban nada)
  function rutasModelo(base) { return (ARCH && ARCH[base] ? ARCH[base].map(function (x) { return x[0]; }) : []); }
  function rutaDelModelo(ruta, base) {
    var todas = rutasModelo(base);
    if (!todas.length || todas.indexOf(ruta) >= 0) return null;
    var nom = ruta.split('/').pop().toLowerCase();
    var igual = todas.filter(function (r) { return r.split('/').pop().toLowerCase() === nom; });
    return igual.length === 1 ? igual[0] : null;
  }
  async function moverA(de, a) {
    try {
      var r = await fetch(D.ruta + '/' + de.split('/').map(encodeURIComponent).join('/'));
      if (!r.ok) throw new Error('No se pudo leer ' + de);
      await api(API + '/archivo?ruta=' + encodeURIComponent(a), { method: 'PUT', body: new Uint8Array(await r.arrayBuffer()), headers: { 'content-type': 'application/octet-stream' } });
      await api(API + '/archivo?ruta=' + encodeURIComponent(de), { method: 'DELETE' });
      return true;
    } catch (e) { toast(e.message, true); return false; }
  }
  async function moverTodos() {
    var base = (D.propio && D.propio.base) || D.evento.modelo, n = 0;
    for (var i = 0; i < (D.archivos || []).length; i++) { var a = D.archivos[i], dest = rutaDelModelo(a.ruta, base); if (dest && await moverA(a.ruta, dest)) n++; }
    toast(n + ' archivos movidos a su carpeta'); await cargar(true);
  }
  async function subir(lista, soloCambios) {
    var reg = $('#registro'); reg.hidden = false; reg.textContent = '';
    var log = function (t) { reg.textContent += t + '\n'; reg.scrollTop = reg.scrollHeight; };
    var base = (D.propio && D.propio.base) || $('#base').value || D.evento.modelo;
    if (!base) return toast('Elegí primero el modelo base y guardá', true);
    if (!D.propio) await api(API, { method: 'POST', json: { base: base } });
    var raiz = D.ruta || ('/propio/' + id + '~0~' + base);
    var subidos = 0, iguales = 0, malos = 0;
    await cargarArchivos();
    for (var i = 0; i < lista.length; i++) {
      var a = lista[i];
      if (/(^|\/)(LEEME\.txt|archivos\.json)$/i.test(a.ruta)) continue;
      var dest = rutaDelModelo(a.ruta, base);
      if (dest) { log('↪ ' + a.ruta + ' → ' + dest + ' (donde está el del modelo)'); a.ruta = dest; }
      try {
        if (soloCambios) {
          var r = await fetch(raiz + '/' + a.ruta.split('/').map(encodeURIComponent).join('/'));
          if (r.ok) { var ant = new Uint8Array(await r.arrayBuffer()); if (ant.length === a.datos.length && await hash(ant) === await hash(a.datos)) { iguales++; continue; } }
        }
        await api(API + '/archivo?ruta=' + encodeURIComponent(a.ruta), { method: 'PUT', body: a.datos, headers: { 'content-type': 'application/octet-stream' } });
        subidos++; log('✔ ' + a.ruta + ' (' + kb(a.datos.length) + ')');
      } catch (e) { malos++; log('✘ ' + a.ruta + ': ' + e.message); }
    }
    log('— Subidos: ' + subidos + (iguales ? ' · sin cambios (salteados): ' + iguales : '') + (malos ? ' · con error: ' + malos : ''));
    toast('Listo: ' + subidos + ' archivos subidos');
    await cargar(true);
  }
  async function recibir(archivosInput, carpeta) {
    var lista = [];
    for (var i = 0; i < archivosInput.length; i++) {
      var f = archivosInput[i], buf = await f.arrayBuffer();

    var picker = el('input', { type: 'color', value: hacia || desde });
    var txt = el('input', { type: 'text', value: hacia || '', placeholder: 'sin cambio', spellcheck: 'false' });
    var fila = el('div', { class: 'reemp' + (activo ? ' activo' : ''), 'data-desde': desde }, [sw, el('code', { text: desde }), us.length ? el('button', { class: 'cant', type: 'button', title: 'Ver y cambiar cada uso por separado', onclick: function () { lista.hidden = !lista.hidden; grupo.classList.toggle('abierto', !lista.hidden); } }, '×' + (cant || us.length) + ' ▾') : el('span', { class: 'cant', text: cant ? '×' + cant : '' }), el('span', { class: 'fl', text: '→' }), picker, txt,
      el('button', { class: 'b sec', style: 'padding:6px 9px', title: 'Sin cambio', onclick: function () { txt.value = ''; picker.value = desde; fila.classList.remove('activo'); } }, '✕')]);
    picker.addEventListener('input', function () { txt.value = picker.value; fila.classList.add('activo'); });

  function agregarColor() {

  }
  function filaFuente(desde, hacia, escala) {
    var dl = 'cat-fuentes';
    if (!$('#' + dl)) document.body.append(el('datalist', { id: dl }, (CATALOGO || []).map(function (f) { return el('option', { value: f }); })));
    var a = el('input', { type: 'text', value: desde, placeholder: 'Fuente del modelo', spellcheck: 'false' });
    var b = el('input', { type: 'text', value: hacia, placeholder: 'Nueva fuente (sin cambio)', list: dl, spellcheck: 'false' });
    // README (ronda 60): tamaño de la fuente (100 % = igual; Amsterdam Four, por ejemplo, va bien cerca de 70 %)
    var tam = el('input', { type: 'number', min: '30', max: '250', step: '5', value: escala || 100, title: 'Tamaño de la fuente (%)' });
    var muestra = el('span', { style: 'white-space:nowrap;overflow:hidden', text: 'Ana & Juan' });
    var original = el('span', { style: 'white-space:nowrap;overflow:hidden;opacity:.45;font-size:22px', text: 'Ana & Juan' });
    var pinta = function () { muestra.style.fontFamily = '"' + (b.value || a.value) + '"'; muestra.style.fontSize = (22 * (Number(tam.value) || 100) / 100) + 'px'; original.style.fontFamily = '"' + a.value + '"'; };
    b.addEventListener('input', pinta); tam.addEventListener('input', pinta); a.addEventListener('input', pinta); pinta();
    var f = el('div', { class: 'fuente-fila' }, [a, el('span', { class: 'fl', text: '→', style: 'text-align:center' }), b, el('label', { class: 'tam' }, [tam, '%']), el('div', { style: 'display:grid;line-height:1.2' }, [original, muestra])]);
    $('#lista-fuentes').append(f);
    if (!$('#css-catalogo')) document.head.append(el('link', { id: 'css-catalogo', rel: 'stylesheet', href: '/comun/fonts/catalogo/catalogo.css' }));
  }
  function pintarReemplazos() {
    var p = D.propio || {}, guardados = {}; (p.colores || []).forEach(function (x) { guardados[aHex(x[0])] = x[1]; });
    var c = DETECTADO.colores, lista = Object.keys(c).sort(function (x, y) { return c[y] - c[x]; });
    // Primero los de la paleta del modelo y los ya cambiados
    var prim = DETECTADO.paleta.concat(Object.keys(guardados)).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
    lista = prim.concat(lista.filter(function (x) { return prim.indexOf(x) < 0; })).slice(0, 60);
    $('#lista-colores').replaceChildren.apply($('#lista-colores'), lista.map(function (x) { return filaColor(x, guardados[x] || '', c[x] || 0); }));
    $('#lista-fuentes').replaceChildren();
    var fg = {}, fe = {}; (p.fuentes || []).forEach(function (x) { fg[x[0]] = x[1] === x[0] ? '' : x[1]; fe[x[0]] = x[2] || 100; });
    var fs = Object.keys(DETECTADO.fuentes).sort(function (x, y) { return (DETECTADO.fuentes[y] - DETECTADO.fuentes[x]); });
    Object.keys(fg).forEach(function (f) { if (fs.indexOf(f) < 0) fs.unshift(f); });
    fs.forEach(function (f) { filaFuente(f, fg[f] || '', fe[f] || 100); });
  }
  // Lo que pidió el cliente: la paleta original del modelo → los colores que eligió (mismo orden); la fuente de títulos → la suya
  function cargarPedido() {
    var d = (D.pedido && D.pedido.diseno) || {};
    if (!DETECTADO) return toast('Esperá a que se carguen los colores del modelo', true);
    var cols = ((d.paleta && d.paleta.modo === 'cambiar' && d.paleta.colores) || []).map(function (c) { return aHex(typeof c === 'string' ? c : c && c.color); });
    var n = 0, usados = {};
    DETECTADO.paleta.forEach(function (orig, i) {
      // Si la paleta repite un color, vale el primero; un color igual al original no es un cambio
      if (!orig || !cols[i] || usados[orig] || cols[i] === orig) return;
      usados[orig] = 1;
      var fila = $('#lista-colores .reemp[data-desde="' + orig + '"]') || (function () { $('#lista-colores').prepend(filaColor(orig, '', 0)); return $('#lista-colores .reemp[data-desde="' + orig + '"]'); })();
      var ins = fila.querySelectorAll('input'); ins[0].value = cols[i]; ins[1].value = cols[i]; fila.classList.add('activo'); n++;
    });

      if (!hecho) filaFuente(DETECTADO.titulos, fuente);
    }
    $('#sec-colores').scrollIntoView({ behavior: 'smooth' });
    toast(n + ' colores' + (fuente ? ' y la tipografía' : '') + ' cargados: revisá y tocá «Guardar colores y tipografías»');
  }
  async function guardarReemplazos(b) {
    var colores = [], fuentes = [], puntuales = [];
    Array.prototype.forEach.call(document.querySelectorAll('#lista-colores .uso'), function (f) { var h = aHex(f.querySelectorAll('input')[1].value); if (h) puntuales.push([f.dataset.clave, f.dataset.desde, h]); });
    Array.prototype.forEach.call(document.querySelectorAll('#lista-colores .reemp'), function (f) { var h = aHex(f.querySelectorAll('input')[1].value); if (h && h !== f.dataset.desde) colores.push([f.dataset.desde, h]); });
    Array.prototype.forEach.call(document.querySelectorAll('#lista-fuentes .fuente-fila'), function (f) {
      var ins = f.querySelectorAll('input'), de = ins[0].value.trim(), a = ins[1].value.trim(), esc = Number(ins[2].value) || 100;
      if (de && (a || esc !== 100)) fuentes.push([de, a || de, esc]);

  function pintarPlantillas() {
    var sel = $('#plantilla'), base = $('#base').value, actual = sel.value;
    var lista = (ARCH && ARCH[base] ? ARCH[base].map(function (x) { return x[0]; }) : []).concat((D.archivos || []).map(function (a) { return a.ruta; })).filter(function (r, i, a) { return /\.html$/.test(r) && a.indexOf(r) === i; });

    lista.forEach(function (r) { sel.append(el('option', { value: r, text: r })); });
    sel.value = lista.indexOf(actual) >= 0 ? actual : '';
  }
  function cargarArchivos() { return ARCH ? Promise.resolve() : fetch('/modelos/archivos.json').then(function (r) { return r.json(); }).then(function (a) { ARCH = a; }).catch(function () { ARCH = {}; }); }

  async function guardar(b) {
    b.disabled = true;
    try {
      await api(API, { method: 'POST', json: { base: $('#base').value || undefined, plantilla: $('#plantilla').value, css: $('#css').value, head: $('#head').value, notas: $('#notas').value } });

  async function activar(b, si) {
    b.disabled = true;
    try {
      await api(API, { method: 'POST', json: { activo: si, base: $('#base').value || undefined } });
      var e = D.evento;
      if (si && e.producto === 'a-medida') {
        try { await api('/api/admin/medidas/' + e.id + '/lista', { method: 'POST', json: { parte: 'medida' } }); } catch (x) { /* ya estaba lista o no se envió */ }

})();
