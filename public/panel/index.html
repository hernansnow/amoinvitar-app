<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Amo Invitar</title>
  <link rel="icon" type="image/svg+xml" href="https://amoinvitar.com/favicon.svg">
  <link rel="stylesheet" href="/comun/fonts/google/great-vibes+jost.css">
  <link rel="stylesheet" href="/comun/fonts/catalogo/catalogo.css">
  <link rel="stylesheet" href="/panel/panel.css">
</head>
<body>
  <header class="barra">
    <button type="button" class="btn-volver" id="btn-volver" aria-label="Volver" title="Volver"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a class="marca" href="https://amoinvitar.com/" id="marca"><img class="logo-largo" src="/comun/img/amoinvitar-blanco.svg" alt="Amo Invitar!" width="110"><img class="logo-corto" src="/comun/img/amoinvitar-isotipo-blanco.png" alt="Amo Invitar!" width="36" height="38"></a>
    <div class="titulo"><strong id="titulo-evento">Cargando…</strong><span id="estado-guardado" aria-live="polite"></span><button type="button" class="btn-link solo-movil" id="btn-modelo-movil">Cambiar de modelo</button></div>
    <div class="selector-modelo solo-escritorio" id="selector-modelo"></div>
    <div class="caja-plan solo-escritorio" id="caja-plan"></div>
    <div class="acciones">
      <a class="btn btn-sec btn-ayuda" id="btn-ayuda" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="btn-redondo" id="btn-manual" title="Ayuda y manual de uso" aria-label="Ayuda y manual de uso"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.2v.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" class="btn-redondo solo-movil" id="btn-ojo" title="Ver la invitación" aria-label="Ver la invitación"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button type="button" class="btn-redondo solo-escritorio" id="btn-completa" title="Pantalla completa" aria-label="Pantalla completa" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <div class="modo-vista solo-escritorio" role="group" aria-label="Ver como">
        <button type="button" data-modo="celular" aria-pressed="true" title="Celular" aria-label="Ver en celular"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="18.2" r="1" fill="currentColor"/></svg></button>
        <button type="button" data-modo="pc" aria-pressed="false" title="Computadora" aria-label="Ver en computadora"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
      <button type="button" class="btn" id="btn-publicar">Publicar</button>
    </div>
  </header>

  <!-- Editar la invitación o administrarla (respuestas, envío, mesas…) -->
  <nav class="modos" id="modos" aria-label="Modo">
    <button type="button" data-modo="editar" aria-pressed="true">Editar invitación</button>
    <button type="button" data-modo="admin" aria-pressed="false">Administración</button>
    <!-- En la computadora, el avance va acá (no se pierde en pantallas chicas) -->
    <div class="linea-pasos solo-escritorio" id="linea-pasos"></div>
  </nav>
  <section class="admin" id="admin" aria-label="Administración" hidden></section>

  <div class="layout" id="layout">
    <nav class="pasos" id="pasos" aria-label="Pasos"></nav>
    <section class="editor" id="editor" aria-label="Configurar">
      <div class="hoja-cabeza solo-movil" id="hoja-cabeza">
        <div class="agarre" id="agarre" role="separator" aria-orientation="horizontal" aria-label="Mover la división entre la vista previa y el panel" tabindex="0"></div>
        <div class="hoja-fila"><span class="donde" id="donde"></span>
          <button type="button" class="btn-redondo chico" id="btn-hoja" aria-label="Agrandar el panel" title="Agrandar el panel"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="ver-todas" id="btn-ver-pasos">☰ Ver todos</button></div>
        <span class="progreso" id="progreso-movil"></span>
      </div>
      <main class="formulario" id="formulario" tabindex="-1"></main>
    </section>
    <aside class="previa" id="previa" aria-label="Vista previa">
      <div class="previa-barra" id="previa-barra">
        <strong>Así se verá</strong>
        <div class="previa-botones">
          <div class="modo-vista" role="group" aria-label="Ver como">
            <button type="button" data-modo="celular" aria-pressed="true" aria-label="Ver en celular"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="18.2" r="1" fill="currentColor"/></svg></button>
            <button type="button" data-modo="pc" aria-pressed="false" aria-label="Ver en computadora"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="1.8"/></svg></button>
          </div>
          <button type="button" class="btn btn-sec" id="btn-editar">← Editar</button>
          <button type="button" class="btn" id="btn-publicar-2">Publicar</button>
        </div>
      </div>
      <button type="button" class="btn-redondo chico desplegar" id="btn-desplegar" aria-label="Abrir el panel" title="Abrir el panel">›</button>
      <div class="zona-pantalla" id="zona-pantalla">
        <div class="pantalla celular" id="pantalla"><div class="escala" id="escala">
          <iframe id="iframe-vista" title="Vista previa de la invitación" src="about:blank"></iframe>
          <iframe id="iframe-vista-b" title="Vista previa de la invitación" src="about:blank" class="atras" aria-hidden="true" tabindex="-1"></iframe>
        </div></div>
      </div>
    </aside>
  </div>

  <footer class="barra-inferior solo-movil" id="barra-inferior">
    <button type="button" class="btn-link nav-btn" id="btn-anterior"><span class="flecha" aria-hidden="true">←</span><span>Atrás</span></button>
    <button type="button" class="plan-mini" id="plan-mini"></button>
    <button type="button" class="btn nav-btn" id="btn-siguiente"><span class="flecha" aria-hidden="true">→</span><span>Siguiente</span></button>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo"><div class="modal-cuerpo" id="modal-cuerpo"></div></dialog>
  <div class="aviso" id="aviso" role="status" hidden></div>
  <script src="/panel/qrcode.js" defer></script>
  <script type="module" src="/panel/panel.js"></script>
</body>
</html>
